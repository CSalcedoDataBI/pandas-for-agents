name: Validate

on:
  # R1: the gate runs on pull requests. Pushes to main come from merged PRs, or from
  # admin-bypass docs commits that the check does not need to see twice.
  pull_request:
  # release-please opens its PR with the Actions token, which does not trigger pull_request;
  # its workflow dispatches this one on the release branch instead.
  workflow_dispatch:

permissions:
  contents: read

# R2: only the latest push to a ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # Public repo: GitHub runners are free, and a self-hosted runner would run fork PRs locally.
    runs-on: ubuntu-latest
    # R3: anything past 10 min is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Repo checks (skills frontmatter, workflow cost rules)
        run: python scripts/check_repo.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Every pandas name in skills/ is in the catalogue
        run: python scripts/check_names.py
      - name: The change list is what build_changes.py produces
        run: python scripts/build_changes.py --check
      - name: Each catalogue is what its pandas version exports
        run: |
          for f in catalog/pandas-*.json; do
            v="${f#catalog/pandas-}"; v="${v%.json}"
            uv run --no-project --python 3.13 --with "pandas==$v" python scripts/export_catalog.py --check
          done
