name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # To dispatch Validate on the release branch (last step).
  actions: write

# R2 with the standard's exception: cancel-in-progress FALSE. A release cancelled halfway leaves
# tags and PRs inconsistent, which costs more than the minute it saves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # R3: the action reads commits and updates one PR, seconds in practice.
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # release-please-config.json and .release-please-manifest.json at the repo root.

      # The release PR is pushed by the Actions token, so pull_request does not run Validate on
      # it and the required check would never report. workflow_dispatch is the one trigger GitHub
      # allows from that token, so the verdict is asked for here, by name.
      - name: Ask Validate for a verdict on the release branch
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run validate.yml --ref "$BRANCH"
